name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Docker image
        run: nix build .#docker

      - name: Load Docker image
        run: |
          OUT=$(nix build .#docker --print-out-paths)
          nix store cat "$OUT" | docker load

      - name: Generate build summary
        run: |
          chmod +x build-summary.sh
          bash build-summary.sh nix-xfce-kasm:latest build-summary.md

      - name: Save Docker image tarball
        run: |
          OUT=$(nix build .#docker --print-out-paths)
          nix store cat "$OUT" > nix-xfce-kasm.tar.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            nix-xfce-kasm.tar.gz \
            build-summary.md \
            sbom.txt

      - name: Append build summary to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh release view "${{ github.event.release.tag_name }}" --json body -q .body)
          SUMMARY=$(cat build-summary.md)
          COMBINED=$(printf '%s\n\n---\n\n%s' "$EXISTING" "$SUMMARY")
          gh release edit "${{ github.event.release.tag_name }}" --notes "$COMBINED"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GHCR_IMAGE_LOWER=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')

          docker tag nix-xfce-kasm:latest "${GHCR_IMAGE_LOWER}:${VERSION}"
          docker tag nix-xfce-kasm:latest "${GHCR_IMAGE_LOWER}:latest"

          docker push "${GHCR_IMAGE_LOWER}:${VERSION}"
          docker push "${GHCR_IMAGE_LOWER}:latest"
