name: Docker

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NIX_IMAGE: nix-xfce-kasm

jobs:
  # Fast, hermetic checks. Runs first so a broken auth path fails in seconds
  # rather than after a full image build.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run the test suite
        run: nix run .#test

  # The same container on the current QGIS release rather than the LTR, so a
  # regression in what will become the next LTR shows up here — while it can
  # still be reported upstream — instead of on the day that LTR ships.
  #
  # Deliberately leaner than the job below: no SBOM, no CVE table, no build
  # report. The LTR image is the supported artefact; this one is a test
  # vehicle. It runs in parallel, so it does not lengthen the critical path.
  build-qgis-latest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and load the current-QGIS image
        run: |
          OUT=$(nix build .#docker-qgis-latest --print-out-paths)
          nix store cat "$OUT" | docker load
          docker image inspect ${{ env.NIX_IMAGE }}:qgis-latest \
            --format 'QGIS {{index .Config.Labels "com.kartoza.qgis.version"}} ({{index .Config.Labels "com.kartoza.qgis.channel"}})'

      - name: Smoke-test the desktop
        run: |
          docker run -d --name qgis-latest-smoke -p 8443:8443 --cap-add=NET_ADMIN \
            ${{ env.NIX_IMAGE }}:qgis-latest
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8443/ || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          docker logs qgis-latest-smoke | head -30
          # 401 means Xkasmvnc is serving and BasicAuth is enforced.
          test "$code" = "401"
          docker rm -f qgis-latest-smoke

      - name: Push to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        if: github.event_name == 'release'
        run: |
          GHCR_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ github.event.release.tag_name }}"
          docker tag ${{ env.NIX_IMAGE }}:qgis-latest "${GHCR_IMAGE}:qgis-latest"
          docker tag ${{ env.NIX_IMAGE }}:qgis-latest "${GHCR_IMAGE}:${VERSION}-qgis-latest"
          docker push "${GHCR_IMAGE}:qgis-latest"
          docker push "${GHCR_IMAGE}:${VERSION}-qgis-latest"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Nix Docker image
        run: nix build .#docker -o result

      - name: Load Docker image
        run: |
          OUT=$(nix build .#docker --print-out-paths)
          nix store cat "$OUT" | docker load
          # The default image is built on QGIS LTR and carries the :ltr tag.
          # Everything downstream — SBOM, report, publish — works off :latest,
          # which is also what users pull, so alias it here.
          docker tag ${{ env.NIX_IMAGE }}:ltr ${{ env.NIX_IMAGE }}:latest

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag image with version
        run: |
          docker tag ${{ env.NIX_IMAGE }}:latest ${{ env.NIX_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Export image as tarball
        run: |
          docker save ${{ env.NIX_IMAGE }}:latest | gzip > ${{ env.NIX_IMAGE }}.tar.gz

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.NIX_IMAGE }}:latest
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Generate SBOM with syft (for table)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ${{ env.NIX_IMAGE }}:latest -o json > sbom-syft.json

      - name: Generate SBOM table
        run: python3 scripts/sbom_table.py sbom-syft.json > sbom-table.md

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan for CVEs
        run: |
          grype sbom:sbom.spdx.json -o json > cve-scan.json 2>/dev/null || echo '{"matches":[]}' > cve-scan.json

      - name: Generate CVE table
        run: python3 scripts/cve_table.py cve-scan.json > cve-table.md

      - name: Generate build report
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          GHCR_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$(docker image inspect ${{ env.NIX_IMAGE }}:latest --format '{{.Id}}' | cut -c8-19)
          IMAGE_SIZE=$(docker image inspect ${{ env.NIX_IMAGE }}:latest --format '{{.Size}}' | numfmt --to=iec-i --suffix=B)
          TARBALL_SIZE=$(stat --format=%s ${{ env.NIX_IMAGE }}.tar.gz | numfmt --to=iec-i --suffix=B)
          LAYER_COUNT=$(docker image inspect ${{ env.NIX_IMAGE }}:latest --format '{{len .RootFS.Layers}}')

          cat > build-report.md <<EOF
          ## Docker Image Build

          | Property | Value |
          |----------|-------|
          | Registry | \`${GHCR_IMAGE}\` |
          | Tag | \`${VERSION}\` |
          | Image ID | \`${IMAGE_ID}\` |
          | Image Size | ${IMAGE_SIZE} |
          | Tarball Size | ${TARBALL_SIZE} |
          | Layers | ${LAYER_COUNT} |
          | Port | 8443 |

          ### Quick Start

          \`\`\`bash
          docker pull ${GHCR_IMAGE}:${VERSION}
          docker run --rm -p 8443:8443 ${GHCR_IMAGE}:${VERSION}
          # Open http://localhost:8443
          \`\`\`

          ### Docker Compose

          \`\`\`yaml
          services:
            qgis-desktop:
              image: ${GHCR_IMAGE}:${VERSION}
              ports:
                - "8443:8443"
              volumes:
                - qgis-home:/home/user
              restart: unless-stopped
          volumes:
            qgis-home:
          \`\`\`

          ### SBOM

          $(cat sbom-table.md)

          ### CVE Scan

          $(cat cve-table.md)
          EOF

          # Strip leading whitespace from heredoc
          sed -i 's/^          //' build-report.md

          # Also write step summary
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"

      # --- PR-specific steps ---

      - name: Upload image artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.NIX_IMAGE }}.tar.gz
          retention-days: 7
          overwrite: true

      - name: Upload SBOM artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7
          overwrite: true

      - name: Upload CVE scan artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cve-scan
          path: cve-scan.json
          retention-days: 7
          overwrite: true

      # --- PR comment with build report ------------------------------------
      #
      # Earlier revisions of this section slurped build-report.md into
      # $GITHUB_ENV as REPORT_BODY. The env-var approach blew up runs because
      # build-report.md is dominated by a ~150 KB CVE table. Once REPORT_BODY
      # entered the environment, every subsequent step's `execve` for Node 24
      # hit E2BIG ("Argument list too long") — that's why even the
      # Post-Checkout cleanup was failing.
      #
      # Fix: build the full comment body (tag + artifact link + commit +
      # report + "Download & Run" instructions) into pr-comment.md on disk,
      # then feed the file to create-or-update-comment via body-path. The
      # body never enters the process environment.

      - name: Find existing PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Docker Image Build"

      - name: Assemble PR comment body
        if: github.event_name == 'pull_request'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NIX_IMAGE: ${{ env.NIX_IMAGE }}
        run: |
          {
            printf '%s\n\n' "$TAG"
            printf '[Download image artifact](https://github.com/%s/actions/runs/%s)\n\n' "$REPO" "$RUN_ID"
            printf 'Commit: `%s`\n\n---\n\n' "$SHA"
            cat build-report.md
            cat <<ARTIFACT_EOF

          ### Download & Run This Build

          1. Download the \`docker-image\` artifact from the [workflow run](https://github.com/${REPO}/actions/runs/${RUN_ID})
          2. Load and run:

          \`\`\`bash
          # Unzip the downloaded artifact
          unzip docker-image.zip

          # Load into Docker
          docker load < ${NIX_IMAGE}.tar.gz

          # Run it
          docker run --rm -p 8443:8443 ${NIX_IMAGE}:latest

          # Open http://localhost:8443
          \`\`\`
          ARTIFACT_EOF
          } > pr-comment.md

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: pr-comment.md

      # --- Release-specific steps ---

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'release'
        run: |
          GHCR_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ steps.version.outputs.tag }}"

          docker tag ${{ env.NIX_IMAGE }}:latest "${GHCR_IMAGE}:${VERSION}"
          docker tag ${{ env.NIX_IMAGE }}:latest "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${VERSION}"
          docker push "${GHCR_IMAGE}:latest"

      - name: Set package visibility to public
        if: github.event_name == 'release'
        continue-on-error: true
        run: |
          PKG_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          gh api \
            --method PUT \
            /orgs/${{ github.repository_owner }}/packages/container/${PKG_NAME}/visibility \
            -f visibility=public 2>/dev/null || echo "Warning: Could not set package visibility (org policy may prevent it)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append build report to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body_path: build-report.md
          files: |
            ${{ env.NIX_IMAGE }}.tar.gz
            sbom.spdx.json
            cve-scan.json
