#
# Single sign-on in front, a persistent home behind — the two headline features
# composed, which is how a real deployment uses them.
#
#   docker compose up    (or: nix run .#run-sso-homes-scenario)
#
# ONE MANUAL STEP, on the machine running the browser:
#
#   echo '127.0.0.1 keycloak' | sudo tee -a /etc/hosts
#
# The browser and the container must reach Keycloak under the same name, or the
# token's `iss` will not match what the proxy expects. Then open
# http://keycloak:8443 and sign in as alice / hunter2.
#
# What this demonstrates that the other examples do not: the OIDC proxy is the
# only public listener, the desktop behind it is bound to loopback, and the home
# directory it restores is the one in object storage. Three moving parts, one
# container.
#
# DEMO CREDENTIALS. The realm, its client secret, and the MinIO keys are all
# public in this repository.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sso-homes-keycloak
    command: [start-dev, --import-realm, --http-port=8080]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://keycloak:8080
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      # The same realm the keycloak-oidc example uses: alice has the qgis-user
      # role, mallory does not.
      - ../keycloak-oidc/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: sso-homes-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  create-bucket:
    image: minio/mc:latest
    container_name: sso-homes-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set demo http://minio:9000 minioadmin minioadmin123
        mc mb --ignore-existing demo/qgis-homes
        echo "bucket ready"

  qgis-desktop:
    image: kartoza:qgis-desktop-ltr
    container_name: sso-homes-desktop
    hostname: qgis-desktop-0
    depends_on:
      keycloak:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    cap_add:
      - NET_ADMIN
    environment:
      # --- Who may open the desktop -------------------------------------
      - QGIS_DESKTOP_AUTH_MODE=oidc
      - QGIS_DESKTOP_OIDC_ISSUER_URL=http://keycloak:8080/realms/qgis
      - QGIS_DESKTOP_OIDC_CLIENT_ID=qgis-desktop
      - QGIS_DESKTOP_OIDC_CLIENT_SECRET=qgis-desktop-demo-secret-not-for-real-use
      - QGIS_DESKTOP_OIDC_REDIRECT_URL=http://keycloak:8443/oauth2/callback
      - QGIS_DESKTOP_OIDC_ALLOWED_ROLES=qgis-user
      - QGIS_DESKTOP_OIDC_EMAIL_DOMAINS=*

      # The desktop behind the proxy runs as a single session. Switch to
      # `greeter` to put a per-user Linux login behind SSO as well — worth it
      # when several people share one container, unnecessary when each person
      # gets their own.
      - QGIS_DESKTOP_OIDC_INNER_MODE=none

      # --- What they find when they get there ----------------------------
      - QGIS_DESKTOP_PERSIST=1
      - QGIS_DESKTOP_PERSIST_TYPE=s3
      - QGIS_DESKTOP_PERSIST_PROVIDER=Minio
      - QGIS_DESKTOP_PERSIST_ENDPOINT=http://minio:9000
      - QGIS_DESKTOP_PERSIST_BUCKET=qgis-homes
      - QGIS_DESKTOP_PERSIST_PREFIX=alice-3d9f21c8
      - QGIS_DESKTOP_PERSIST_ACCESS_KEY=minioadmin
      - QGIS_DESKTOP_PERSIST_SECRET_KEY=minioadmin123
      - QGIS_DESKTOP_PERSIST_INTERVAL=60
      - QGIS_DESKTOP_PERSIST_QUOTA=2G

      - VNC_RESOLUTION=1600x900
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  minio-data:
