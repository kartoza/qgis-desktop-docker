# Baked-in DEFAULT, matching giswater-suite's own local dev stack
# (host=giswater-db, user/password=docker) so the demo projects in
# resources/demo-projects/ resolve out of the box against that stack.
#
# Production (QCD) overwrites this file per EndUser with real credentials —
# GeoHosting's render_pg_service_conf() renders and injects its own
# pg_service.conf the same way giswater-suite's own compose setup already
# overrides this file today (a single-file bind mount at
# /home/user/.pg_service.conf, which replaces this baked default cleanly
# regardless of what's underneath). This file is only ever the fallback for
# a container started without that override.
[qwc_giswaterdb]
host=giswater-db
port=5432
dbname=giswater
user=docker
password=docker
sslmode=disable
