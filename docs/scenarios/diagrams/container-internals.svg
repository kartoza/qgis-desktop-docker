<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="c-arr" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">
    qgis-desktop container — boot flow and privilege drop
  </text>
  <text x="470" y="48" text-anchor="middle" fill="#64748b" font-size="12">
    Left column: process lifecycle. Right column: state produced at each step.
  </text>

  <!-- Root band -->
  <rect x="30" y="80" width="480" height="240" rx="10"
        fill="#fef3c7" stroke="#92400e" stroke-dasharray="6 4"/>
  <text x="46" y="102" fill="#78350f" font-weight="600">running as root (PID 1)</text>

  <rect x="60" y="118" width="200" height="70" rx="6" fill="#fff" stroke="#78350f"/>
  <text x="160" y="140" text-anchor="middle" font-weight="600" fill="#0f172a">
    qgis-entrypoint
  </text>
  <text x="160" y="158" text-anchor="middle" fill="#64748b" font-size="11">
    /nix/store/…/qgis-entrypoint
  </text>
  <text x="160" y="174" text-anchor="middle" fill="#64748b" font-size="11">
    (writeShellApplication)
  </text>

  <rect x="60" y="202" width="200" height="52" rx="6" fill="#fff" stroke="#78350f"/>
  <text x="160" y="222" text-anchor="middle" fill="#0f172a">read KASM_EGRESS_*</text>
  <text x="160" y="240" text-anchor="middle" fill="#64748b" font-size="11">
    resolve hostnames via getent
  </text>

  <rect x="60" y="266" width="200" height="42" rx="6" fill="#fff" stroke="#78350f"/>
  <text x="160" y="292" text-anchor="middle" fill="#0f172a">install nftables ruleset</text>

  <!-- Right column: nftables state -->
  <rect x="290" y="118" width="200" height="190" rx="6"
        fill="#fefce8" stroke="#78350f"/>
  <text x="390" y="138" text-anchor="middle" font-weight="600" fill="#78350f">
    nftables state
  </text>
  <text x="300" y="162" fill="#0f172a" font-size="11">table inet filter { }</text>
  <text x="300" y="182" fill="#0f172a" font-size="11">output policy drop;</text>
  <text x="300" y="200" fill="#0f172a" font-size="11">   oif lo accept</text>
  <text x="300" y="218" fill="#0f172a" font-size="11">   ct established,related accept</text>
  <text x="300" y="236" fill="#0f172a" font-size="11">   dst 127.0.0.11 dport 53 accept</text>
  <text x="300" y="254" fill="#0f172a" font-size="11">   dst RESOLVED_DB_IP accept</text>
  <text x="300" y="274" fill="#64748b" font-size="11">forward policy drop</text>
  <text x="300" y="292" fill="#64748b" font-size="11">input policy accept</text>

  <!-- setpriv arrow across bands -->
  <path d="M 160 308 L 160 348" stroke="#0f172a" stroke-width="1.5" fill="none"
        marker-end="url(#c-arr)"/>
  <text x="180" y="332" fill="#0f172a">setpriv --reuid=1000 --inh-caps=-all</text>

  <!-- User band -->
  <rect x="30" y="352" width="880" height="290" rx="10"
        fill="#dcfce7" stroke="#166534" stroke-dasharray="6 4"/>
  <text x="46" y="374" fill="#14532d" font-weight="600">running as uid 1000, no ambient/inheritable caps</text>

  <rect x="60" y="392" width="200" height="60" rx="6" fill="#fff" stroke="#166534"/>
  <text x="160" y="414" text-anchor="middle" font-weight="600" fill="#0f172a">
    start-desktop
  </text>
  <text x="160" y="432" text-anchor="middle" fill="#64748b" font-size="11">
    (writeShellApplication)
  </text>

  <rect x="60" y="466" width="200" height="42" rx="6" fill="#fff" stroke="#166534"/>
  <text x="160" y="492" text-anchor="middle" fill="#0f172a">
    load KASM_USERS_FILE / env
  </text>

  <rect x="60" y="520" width="200" height="42" rx="6" fill="#fff" stroke="#166534"/>
  <text x="160" y="546" text-anchor="middle" fill="#0f172a">
    build DLP flag list
  </text>

  <rect x="60" y="574" width="200" height="52" rx="6" fill="#fff" stroke="#166534"/>
  <text x="160" y="596" text-anchor="middle" fill="#0f172a">exec Xkasmvnc</text>
  <text x="160" y="614" text-anchor="middle" fill="#64748b" font-size="11">
    → dbus → XFCE → QGIS
  </text>

  <!-- Right column: creds + DLP state -->
  <rect x="290" y="392" width="290" height="88" rx="6"
        fill="#f0fdf4" stroke="#166534"/>
  <text x="435" y="412" text-anchor="middle" font-weight="600" fill="#14532d">
    ~/.kasmpasswd
  </text>
  <text x="304" y="434" fill="#0f172a" font-size="11">bob:$argon2id$…</text>
  <text x="304" y="452" fill="#64748b" font-size="11">
    written by kasmvncpasswd -u bob -w -r
  </text>
  <text x="304" y="470" fill="#64748b" font-size="11">
    mode 0600, owned by uid 1000
  </text>

  <rect x="290" y="494" width="290" height="132" rx="6"
        fill="#f0fdf4" stroke="#166534"/>
  <text x="435" y="514" text-anchor="middle" font-weight="600" fill="#14532d">
    Xkasmvnc DLP flags
  </text>
  <text x="304" y="536" fill="#0f172a" font-size="11">-SendCutText 0</text>
  <text x="304" y="554" fill="#0f172a" font-size="11">-AcceptCutText 0</text>
  <text x="304" y="572" fill="#0f172a" font-size="11">-SendPrimary 0</text>
  <text x="304" y="590" fill="#0f172a" font-size="11">-DLP_Log info</text>
  <text x="304" y="608" fill="#0f172a" font-size="11">-DLP_WatermarkText "RESTRICTED — bob %H:%M"</text>

  <!-- Right column: what runs where -->
  <rect x="610" y="392" width="300" height="234" rx="6"
        fill="#f0fdf4" stroke="#166534"/>
  <text x="760" y="412" text-anchor="middle" font-weight="600" fill="#14532d">
    running under uid 1000
  </text>
  <text x="626" y="436" fill="#0f172a">Xkasmvnc  (X server + web + VNC + DLP)</text>
  <text x="626" y="458" fill="#0f172a">dbus-run-session</text>
  <text x="626" y="480" fill="#0f172a">startxfce4</text>
  <text x="626" y="502" fill="#0f172a">   xfwm4, xfce4-panel, xfdesktop</text>
  <text x="626" y="524" fill="#0f172a">   xfce4-terminal</text>
  <text x="626" y="546" fill="#0f172a">   thunar</text>
  <text x="626" y="568" fill="#0f172a">qgis</text>
  <text x="626" y="600" fill="#64748b" font-size="11">
    ↳ any outbound traffic passes through
  </text>
  <text x="626" y="616" fill="#64748b" font-size="11">
    the root-installed nftables ruleset
  </text>
</svg>
