site_name: QGIS Desktop Docker
site_description: QGIS Desktop inside a Nix-built Docker container with browser access via KasmVNC, clipboard/DLP controls, HTTP BasicAuth, and an nftables egress lockdown.
site_url: https://kartoza.github.io/qgis-desktop-docker/
site_author: Kartoza
copyright: >
  &copy; Kartoza &mdash; Made with love by
  <a href="https://kartoza.com">Kartoza</a>
  &middot; <a href="https://github.com/sponsors/kartoza">Donate</a>
  &middot; <a href="https://github.com/kartoza/qgis-desktop-docker">GitHub</a>

repo_url: https://github.com/kartoza/qgis-desktop-docker
repo_name: kartoza/qgis-desktop-docker
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  # Kartoza Brand Pack — logo + favicon (see stylesheets/kartoza-tokens.css
  # for the palette + type stack).
  logo: assets/brand/kartoza-symbol-color.svg
  favicon: assets/brand/favicon.png
  font:
    text: Nunito
    code: JetBrains Mono
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/file-edit-outline
    view: material/eye-outline

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kartoza/qgis-desktop-docker
      name: GitHub repository
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/KartozaGeo
      name: Kartoza on Twitter
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/kartoza
      name: Sponsor on GitHub
  generator: false

extra_css:
  # Single source of truth for the Kartoza palette + type stack.
  # extra.css consumes the tokens it defines.
  - stylesheets/kartoza-tokens.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      strict: false

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Quick Start: getting-started/quickstart.md
    - Nix Workflow: getting-started/nix-workflow.md
    - Building from Source: getting-started/building.md
  - Configuration:
    - configuration/index.md
    - Environment: configuration/environment.md
    - Kasm Permissions: configuration/kasm-permissions.md
    - Authentication: configuration/authentication.md
    - Egress Lockdown: configuration/egress-lockdown.md
  - Scenarios:
    - scenarios/index.md
    - Analyst Locked-Down: scenarios/analyst-locked-down.md
  - Developer Guide:
    - developer-guide/index.md
    - Architecture: developer-guide/architecture.md
    - Nix Flake: developer-guide/nix-flake.md
    - Project Structure: developer-guide/project-structure.md
    - Contributing: developer-guide/contributing.md
  - About:
    - about/index.md
    - Specification: about/specification.md
    - Sponsors: about/sponsors.md
    - License: about/license.md
