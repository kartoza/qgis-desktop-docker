[greeter]
# Kartoza-branded LightDM GTK greeter for the QGIS desktop container.
background=/usr/share/wallpaper.png
theme-name=Adwaita
icon-theme-name=Adwaita
font-name=Sans 11
xft-antialias=true
xft-hintstyle=slight
xft-rgba=rgb
show-clock=true
clock-format=%Y-%m-%d  %H:%M
indicators=~spacer;~clock;~spacer;~session
position=50%,center 50%,center
hide-user-image=true
