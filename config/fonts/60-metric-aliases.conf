<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Metric-compatible substitutions for the Microsoft core fonts.

  QGIS projects routinely specify Arial, because whoever authored them was on
  Windows. Arial is a Monotype font and cannot be redistributed in a container
  image, so QGIS logs "font not found" and silently substitutes something with
  different metrics — which shifts every label on the map.

  Liberation Sans, Serif and Mono are metric-compatible with Arial, Times New
  Roman and Courier New: same advance widths, so text laid out for one occupies
  exactly the same space in the other. They are already in the image, and they
  are SIL OFL, so shipping them is fine.

  fontconfig ships equivalent rules in 30-metric-aliases.conf, but the config
  generated by makeFontsConf does not include its conf.d, so they never applied.
-->
<fontconfig>
  <alias binding="same">
    <family>Arial</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <accept><family>Liberation Mono</family></accept>
  </alias>

  <!-- And the reverse, so a project authored against Liberation still renders
       if someone later adds the real Microsoft fonts to their own image. -->
  <alias binding="same">
    <family>Liberation Sans</family>
    <default><family>Arial</family></default>
  </alias>
</fontconfig>
